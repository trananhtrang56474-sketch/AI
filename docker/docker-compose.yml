version: '3.8'

services:
  # === 后端服务 ===
  backend:
    build:
      context: ../
      # 👇 注意这里：必须是 docker/ 开头
      dockerfile: docker/backend.dockerfile
    container_name: ai-counselor-backend
    ports:
      - "8080:8080"
    volumes:
      - ../backend/instance:/app/instance
      - ../backend/uploads:/app/uploads
    environment:
      - FLASK_ENV=production
    networks:
      - app-network

  # === 前端服务 ===
  frontend:
    build:
      context: ../
      # 👇 注意这里：必须是 docker/ 开头
      dockerfile: docker/frontend.dockerfile
    container_name: ai-counselor-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge